name: Update extension list

on:
  push:
    branches: [main]
    paths:
      - "locale/**"
      - ".github/scripts/update-readme.py"
      - ".github/scripts/locales.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Regenerate the extension list
        run: python .github/scripts/update-readme.py

      - name: Commit if it changed
        run: |
          if git diff --quiet README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update extension list in README" README.md
          git push
