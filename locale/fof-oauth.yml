fof-oauth:
  admin:
    # This is used by extensions which extend fof/oauth to add additional providers
    configure_button_label: "Podesi putem FoF OAuth"
    settings_accessibility_label: "Postavke: {name}"

    permissions:
      moderate_user_providers: "Moderacija povezanih računa korisnika"

    settings:
      advanced:
        heading: "Napredno"
        log-oauth-errors-label: "Bilježi OAuth greške"
        log-oauth-errors-help: "Ako je uključeno, OAuth greške bilježe se u Flarum log. To može pomoći pri otklanjanju OAuth problema, ali log tada može sadržavati i osjetljive podatke."
      only_icons_label: "Prikaži samo ikone na dugmadima za prijavu (alternativni raspored)"
      update_email_from_provider_label: "Ažuriraj e-mail adresu prema podacima provajdera"
      update_email_from_provider_help: "Ako je uključeno, a korisnik se prijavi putem OAuth provajdera čija se potvrđena e-mail adresa razlikuje od adrese na platformi, na novu adresu šalje se link za potvrdu, a na trenutnu obavijest. E-mail adresa se mijenja tek kada se link otvori. Provajderi koji ne mogu potvrditi da je adresa provjerena, uključujući provajdere trećih strana koji još nisu prilagođeni ovoj funkciji, ne mijenjaju e-mail adresu."
      disable_avatars_label: "Ne preuzimaj profilne slike od provajdera"
      disable_avatars_help: "Ako je uključeno, profilna slika korisnika pri registraciji neće se preuzeti od provajdera. Ovo važi samo za buduće registracije i ne mijenja profilne slike postojećih korisnika."
      providers:
        callback_url_text: "Ako je potrebno, kao povratni URL (callback URL) postavite {url}."
        group_label: "Dodijeli grupu"
        group_help: "Odaberite grupu koja se automatski dodjeljuje korisnicima koji se registruju putem ovog provajdera."
        no_group_label: "Bez dodjele grupe"

        discord:
          description: "Napravite aplikaciju na {link}. Preusmjeravajući URL dodajte na kartici OAuth2."

          client_id_label: => fof-oauth.ref.settings.client_id
          client_secret_label: => fof-oauth.ref.settings.client_secret

        facebook:
          description: "Napravite aplikaciju na {link}."

          app_id_label: => fof-oauth.ref.settings.app_id
          app_secret_label: => fof-oauth.ref.settings.app_secret

        github:
          description: "Napravite OAuth aplikaciju na {link}."

          client_id_label: => fof-oauth.ref.settings.client_id
          client_secret_label: => fof-oauth.ref.settings.client_secret

        gitlab:
          description: "Napravite aplikaciju na {link}. Dodijelite joj opseg <code>read_user</code>."

          client_id_label: => fof-oauth.ref.settings.app_id
          client_secret_label: => fof-oauth.ref.settings.app_secret
          domain_label: "GitLab domena"

        google:
          description: "Napravite aplikaciju na {link}."

          client_id_label: => fof-oauth.ref.settings.client_id
          client_secret_label: => fof-oauth.ref.settings.client_secret
          hosted_domain_label: "Domena organizacije (Google Workspace / G Suite, neobavezno)"

        linkedin:
          description: "Napravite aplikaciju na {link}."

          client_id_label: => fof-oauth.ref.settings.client_id
          client_secret_label: => fof-oauth.ref.settings.client_secret

  forum:
    log_in:
      unverified_email_in_use: "Servis {provider} nije potvrdio ovu e-mail adresu, pa je ne možemo koristiti za vašu prijavu. Ako već imate korisnički račun, prijavite se ispod, a zatim u postavkama računa povežite račun {provider}."
      with_button: "Prijava putem računa {provider}"

      # Modify these if your provider requires specific wording.
      # You may use {provider} in the translation.
      with_discord_button: '=> fof-oauth.forum.log_in.with_button'
      with_facebook_button: '=> fof-oauth.forum.log_in.with_button'
      with_github_button: '=> fof-oauth.forum.log_in.with_button'
      with_gitlab_button: '=> fof-oauth.forum.log_in.with_button'
      with_google_button: '=> fof-oauth.forum.log_in.with_button'
      with_linkedin_button: '=> fof-oauth.forum.log_in.with_button'

    user:
      settings:
        linked-account:
          label: "Povezani računi"
          last-used-label: "Posljednje korištenje"
          link-created-label: "Povezano"
          identification-label: "ID ({provider})"
          orphaned-account: "Ranije ste se prijavljivali putem ovog provajdera, ali ova platforma je u međuvremenu isključila prijavu na taj način."
          help: "Povezani računi omogućavaju prijavu na platformu putem drugih provajdera."
          identifier-label: "ID ({provider})"
          unlink-confirm: "Jeste li sigurni da želite ukloniti vezu s računom {provider}? Ubuduće se na ovu platformu nećete moći prijaviti na taj način, osim ako račun ponovo ne povežete."
    # Modify these if you need to change how the provider name
    # appears in the log in button.
    providers:
      discord: '=> fof-oauth.lib.providers.discord'
      facebook: '=> fof-oauth.lib.providers.facebook'
      github: '=> fof-oauth.lib.providers.github'
      gitlab: '=> fof-oauth.lib.providers.gitlab'
      google: '=> fof-oauth.lib.providers.google'
      linkedin: '=> fof-oauth.lib.providers.linkedin'

    account_linked:
      title: "Račun je povezan"
      body: "Vaš korisnički račun <strong>{username}</strong> na platformi {forum} sada je povezan s računom {provider}. Ubuduće se možete prijaviti lozinkom platforme ili putem računa {provider}."
      dismiss_button: "Razumijem"

    signup:
      username_help: "Odaberite korisničko ime pod kojim će vas poznavati na ovoj platformi"

    unlink: "Ukloni vezu"

    error:
      bad_verification_code: "Kod za provjeru nije ispravan ili je istekao. Pokušajte ponovo."
      invalid_state: "Neispravno stanje zahtjeva. Pokušajte ponovo."
      already_linked: "Ovaj račun je već povezan s drugim korisnikom."

  email:
    provider_email_change_notice:
      subject: "Zatražena je promjena e-mail adrese"
      # The greeting is added by the email layout.
      body: |
        Nakon što ste se na platformu {forum} prijavili putem računa {provider}, zatražena je promjena e-mail adrese Vašeg korisničkog računa u {new_email}. Promjena stupa na snagu kada se nova adresa potvrdi.

        Ako to niste bili Vi, Vaš račun {provider} je možda ugrožen. Zaštitite ga i obratite se administratorima platforme {forum}.

  lib:
    providers:
      discord: "Discord"
      facebook: "Facebook"
      github: "GitHub"
      gitlab: "GitLab"
      google: "Google"
      linkedin: "LinkedIn"

    gambits:
      sso:
        key: sso
        hint: "provajder prijave"

  ref:
    settings:
      app_id: "ID aplikacije (App ID)"
      app_secret: "Tajni ključ aplikacije (App Secret)"

      client_id: "ID klijenta (Client ID)"
      client_secret: "Tajni ključ klijenta (Client Secret)"
