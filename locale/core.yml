        cjk_mode_help: Omogućite ako je vaš forum pretežno na kineskom, japanskom ili korejskom jeziku. Pretraga baze podataka zasnovana na riječima ne može pronaći dijelove CJK teksta, pa ova opcija prelazi na pretragu podniza koja to može. Sporija je na vrlo velikim forumima, gdje je konfiguracija fulltext parsera svjesnog CJK jezika na nivou baze podataka (poput ngram parsera u MySQL/MariaDB) brža alternativa.
