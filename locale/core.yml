        timeout_help: Maksimalno vrijeme koje jedan zadatak može trajati prije isteka vremena. Zadana vrijednost je 60 sekundi.
        rest_label: Vrijeme odmora (sekunde)
        rest_help: Vrijeme čekanja između obrade zadataka. Zadana vrijednost je 0 sekundi.
        backoff_label: Odgoda (sekunde)
        backoff_help: Vrijeme čekanja prije ponovnog pokušaja neuspješnog zadatka. Zadana vrijednost je 0 sekundi.
