    # These translations are used in the database driver mismatch warning widget.
    database-driver-mismatch-warning:
      detail: |
        Datoteka <code>config.php</code> podešena je za drajver baze podataka <code>{configured}</code>, ali Flarum je utvrdio da je server baze podataka zapravo <code>{actual}</code>.

        Pogrešan drajver može uzrokovati suptilne greške koje je teško otkriti. U odjeljku <code>database</code> datoteke <code>config.php</code> postavite <code>'driver' => ''{actual}''</code>. Više informacija potražite u <link>Flarum dokumentaciji</link>.
      label: "Neusklađen drajver baze podataka"

    # These translations are used in the database version warning widget.
    database-version-warning:
      below-recommended-detail: |
        Server baze podataka {server} radi na verziji <code>{version}</code>. Ta verzija je podržana, ali Flarum preporučuje {server} <code>{recommended}</code> ili noviju verziju, radi boljih performansi i redovnog održavanja. Više informacija potražite u <link>Flarum dokumentaciji</link>.
      below-recommended-label: "Zastarjela verzija baze podataka"

    # These translations are used in the debug warning widget.
    debug-warning:
      detail: |
        Kada je uključen režim <code>debug</code>, Flarum pri svakom zahtjevu ponovo generiše <code>JavaScript</code> i <code>CSS</code> resurse, a mogu procuriti i druge informacije, poput tajnih podataka baze, varijabli okruženja i sl.

        Izričito se preporučuje da u produkcijskom okruženju isključite <code>debug</code> u datoteci <code>config.php</code>. Više informacija potražite u <link>Flarum dokumentaciji</link>.
      label: "Uključen režim za otklanjanje grešaka (debug)"

