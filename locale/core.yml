      subject: "Aktivirajte svoj novi korisnički račun"
      body: |
        Ova e-mail adresa upotrijebljena je za registraciju na edukativnoj platformi {forum}.

        Ako ste to bili Vi, kliknite na sljedeći link i Vaš korisnički račun bit će aktiviran:
        {url}

        Ako se niste registrovali, zanemarite ovaj e-mail.

