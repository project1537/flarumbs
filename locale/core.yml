    confirm_email:
      subject: "Potvrdite novu e-mail adresu"
      body: |
        Na edukativnoj platformi {forum} e-mail adresa jednog korisničkog računa promijenjena je u ovu.

        Ako ste to bili Vi, kliknite na sljedeći link i Vaša e-mail adresa bit će potvrđena:
