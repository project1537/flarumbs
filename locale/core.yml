    # These translations are used in emails sent when users register new accounts.
    activate_account:
      subject: Aktivirajte vaš novi nalog
      body: |
        Neko (nadamo se da ste to vi!) se registrovao na {forum} sa ovom e-mail adresom.

        Ako ste to bili vi, jednostavno kliknite sljedeći link i vaš nalog će biti aktiviran:
        {url}

        Ako se niste vi registrovali, molimo zanemarite ovaj e-mail.

    # These translations are used in emails sent when users change their email address.
    confirm_email:
      subject: Potvrdite vašu novu e-mail adresu
      body: |
        Neko (nadamo se da ste to vi!) je promijenio svoju e-mail adresu na {forum} u ovu.

        Ako ste to bili vi, jednostavno kliknite sljedeći link i vaš e-mail će biti potvrđen:
        {url}

        Ako ovo niste bili vi, molimo zanemarite ovaj e-mail.

    # These translations are used in emails sent when users ask to reset their passwords.
    reset_password:
      subject: => core.ref.reset_your_password
      body: |
        Neko (nadamo se da ste to vi!) je poslao zahtjev za zaboravljenu lozinku za vaš nalog na {forum}.

        Ako ste to bili vi, kliknite sljedeći link da resetujete vašu lozinku:
        {url}

        Ako ne želite promijeniti vašu lozinku, samo zanemarite ovaj e-mail i ništa se neće desiti.

    # These translations are used when testing mailing configuration
    send_test:
      subject: Flarum test e-mail
      body: |
        Ovo je testni e-mail kojim se potvrđuje da vaša Flarum e-mail konfiguracija ispravno radi.

        Ako ste to bili vi, ovaj e-mail znači da vaša konfiguracija radi!

        Ako ovo niste bili vi, molimo zanemarite ovaj e-mail.

