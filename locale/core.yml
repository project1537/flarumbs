          label: Bisect ekstenzija
          help: Pomaže da se identificira ekstenzija koja uzrokuje problem koji ste primijetili. Ovo automatski stavlja forum u režim održavanja (nizak) dok proces ne bude završen.
        bisect_modal:
          description: >
            Ovo stavlja forum u režim održavanja (nizak) dok proces ne bude završen.
            U svakom koraku određene ekstenzije će biti onemogućene dok ne pronađemo onu koja uzrokuje problem. Zato nemojte biti iznenađeni ako primijetite nedostajuće funkcije ili drugačiji dizajn teme.
            Ostavite ovu stranicu otvorenom i pokušajte reproducirati problem nakon svakog koraka na zasebnoj stranici. Uvijek se možete vratiti na ovu stranicu ako je slučajno zatvorite.
          end_button: Zatvori i idi na stranicu ekstenzija
          issue_question: Da li se problem i dalje javlja?
          issue_question_help: Pokušajte reproducirati problem na zasebnoj stranici i odgovorite na osnovu rezultata.
          no_button: Ne
          result_description: >
            Forum više nije u režimu održavanja. Bisect ekstenzija je završen. Na osnovu vaših odgovora u svakom koraku, uzrok problema je sljedeća ekstenzija:
          start_button: Pokreni bisect
          stop_button: Zaustavi bisect
          steps_left: "Preostalo koraka: {steps}"
