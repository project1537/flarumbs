    # These translations are used in the database driver mismatch warning widget.
    database-driver-mismatch-warning:
      detail: |
        Vaša datoteka <code>config.php</code> je konfigurirana da koristi pogonski program baze podataka <code>{configured}</code>, ali je Flarum otkrio da je server baze podataka zapravo <code>{actual}</code>.

        Korištenje pogrešnog pogonskog programa može uzrokovati suptilne, teško dijagnosticirane greške. Postavite <code>'driver' => ''{actual}''</code> u sekciji <code>database</code> vaše datoteke <code>config.php</code>. Pogledajte <link>Flarum dokumentaciju</link> za više informacija.
      label: Neusklađenost pogonskog programa baze podataka

    # These translations are used in the database version warning widget.
    database-version-warning:
      below-recommended-detail: |
        Vaš {server} server koristi verziju <code>{version}</code>. Ovo je podržano, ali Flarum preporučuje {server} <code>{recommended}</code> ili noviju verziju za najbolje performanse i ostanak na održavanom izdanju. Pogledajte <link>Flarum dokumentaciju</link> za više informacija.
      below-recommended-label: Zastarjela verzija baze podataka

    # These translations are used in the debug warning widget.
    debug-warning:
      detail: |
        Kada je <code>debug</code> režim aktivan, Flarum će ponovo izgraditi svoje <code>JavaScript</code> i <code>CSS</code> resurse pri svakom zahtjevu, a može i potencijalno otkriti druge informacije, poput tajni baze podataka, varijabli okruženja itd.

        Izrazito se preporučuje da onemogućite <code>debug</code> u vašoj datoteci <code>config.php</code> u produkciji. Pogledajte <link>Flarum dokumentaciju</link> za više informacija.
      label: Debug režim aktivan

