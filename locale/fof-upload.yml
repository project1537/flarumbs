        anonymize_description: "Uklanja vezu između korisnika i učitanih datoteka. Same datoteke ostaju dostupne korisnicima koji su ih mogli vidjeti prije anonimizacije."
        delete_description: "Briše sve datoteke koje je korisnik učitao."

fof-upload:
  admin:
    nav:
      shared-uploads-button: "Zajedničke datoteke"
    shared-uploads:
      description: "Učitajte datoteke koje mogu koristiti svi korisnici platforme."
      introduction: |
        Zajedničke datoteke mogu koristiti svi korisnici platforme. Nisu priložene uz neku objavu, ali se mogu umetnuti u objave putem upravitelja medija.

        <strong>Upozorenje:</strong> zajedničke datoteke nisu zaštićene nikakvim dozvolama. Može ih vidjeti svako ko ima njihov URL.
      no-files: "Još nije učitana nijedna zajednička datoteka."
      title: "Zajedničke datoteke"
      upload-new-button: "Učitaj novu datoteku"
    pane:
      title: "Učitavanje datoteka"
      description: "Podesite servise i postavke za učitavanje datoteka."
    help_texts:
      disable-download-logging: |
        Isključuje bilježenje svakog preuzimanja koje korisnici platforme naprave. Ako bilježenje ostane uključeno, ubuduće ćete moći vidjeti broj preuzimanja i druge pokazatelje.
      disable-hotlink-protection: |
        Zaštita od direktnog povezivanja (hotlink) sprečava otvaranje preuzimanja s drugih web stranica. Trenutni način zahtijeva CSRF token i ID objave.
      download_templates: |
        Predlošci prikaza određuju kako se učitane datoteke prikazuju na platformi, npr. kao pregled ili dugme. Trenutno su dostupni:
      mime_types: |
        Odredite koje datoteke članovi smiju učitavati, gdje se koja vrsta čuva i kako se prikazuje u objavi.
      mime_order: |
        Pravila se provjeravaju odozgo prema dolje i primjenjuje se prvo koje odgovara, zato specifičnija pravila stavite iznad općih.
      resize: |
        Odaberite da li se slike smanjuju prije učitavanja. Možete odrediti najveću širinu i visinu u pikselima. Pri smanjivanju se zadržava omjer stranica slike.
      client_extension: |
        Ekstenzija Upload podrazumijevano bira siguran nastavak imena datoteke na osnovu MIME tipa.
        Kod nekih vrsta datoteka zasnovanih na ZIP-u ili binarnim podacima to može dati općeniti nastavak umjesto očekivanog.
        Ovdje unesite listu nastavaka odvojenih zarezom koji će se zadržati u izvornom obliku.
      thumbnails: |
        Pri učitavanju slika pravi se smanjena minijatura. Minijatura se prikazuje u objavi,
        a klik na nju otvara izvornu datoteku u punoj rezoluciji u novoj kartici. Minijature znatno
        smanjuju potrošnju protoka i veličinu stranica na platformama s mnogo velikih slika.
      thumbnail_quality: |
        Kvalitet kodiranja od 1 do 100, primjenjuje se na WebP i JPEG minijature. Veće vrijednosti daju oštriju sliku,
        ali veće datoteke. GIF i PNG minijature su bez gubitaka i zanemaruju ovu postavku.
        Postojeće minijature zadržavaju trenutni kvalitet dok se ponovo ne naprave naredbom backfill.
      watermark: |
        Odaberite da li se slikama pri učitavanju dodaje vodeni žig. Vodeni žig dodaje se svim slikama osim GIF-ova, prema postavkama ispod.
      storage_intro: |
        Ovdje su prikazani servisi koje ste podesili ili koje koristi neka vrsta datoteka. Servis možete podesiti
        prije nego što mu dodijelite ijednu vrstu datoteka – dodijelite ga na kartici Datoteke kada budete spremni.
      storage_configure_another: |
        Drugi servisi za pohranu su instalirani, ali još nisu podešeni. Podešavanje servisa ne mijenja mjesto čuvanja datoteka
        dok ga ne dodijelite nekoj vrsti datoteka.
      storage_not_installed: "Tražite Amazon S3, Cloudflare R2 ili Qiniu? Za njih je potreban dodatni paket – pogledajte <a>instalacija adaptera za pohranu</a>."
      local_cdn: |
        Neobavezno. Ako <code>assets/files</code> isporučujete putem CDN-a, unesite njegov osnovni URL i linkovi učitanih datoteka koristit će ga.
        Ostavite prazno da se datoteke isporučuju direktno s platforme.
      s3_provider: |
        Odabirom provajdera određuju se format endpointa, način adresiranja i podrška za ACL ispod. Odaberite „Drugi S3-kompatibilni“
        ako vaš provajder nije na listi.
      s3_endpoint: |
        URL S3 API-ja provajdera – ne javni URL vašeg bucketa. Za Amazon S3 nije potreban.
      s3_acl: |
        Primjenjuje se na svaki učitani objekat. Ostavite prazno za podrazumijevanu postavku provajdera (obično privatno).
        Koristite <code>public-read</code> ako datoteke moraju biti čitljive direktno iz bucketa.
      s3_acl_unsupported: |
        {provider} ne podržava ACL. Javni pristup podesite u kontrolnoj tabli samog provajdera.
      s3_path_style: |
        Smješta bucket u putanju URL-a umjesto u naziv hosta. Obavezno za MinIO i Cloudflare R2;
        postavlja se automatski kada odaberete provajdera.
      custom_s3_url: |
        Javni osnovni URL s kojeg se isporučuju datoteke – CDN ili vlastita domena ispred bucketa.
        Ostavite prazno da se koristi podrazumijevani URL provajdera. Mora sadržavati <code>https://</code>.
      s3_instance_profile: |
        Ostavite oba polja prazna da se umjesto toga koristi IAM uloga – radi samo na EC2, ECS ili EKS.
      composer_buttons: |
        Podrazumijevano su vidljiva oba dugmeta: dugme upravitelja medija i dugme za učitavanje. Možete odabrati i da se prikazuje samo jedno.
