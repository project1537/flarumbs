    warnings:
      fileinfo_missing: |
        PHP ekstenzija <strong>fileinfo</strong> nije učitana na ovom serveru. FoF Upload će i dalje raditi, ali je isključena unakrsna provjera MIME tipa, što smanjuje zaštitu od lažno predstavljenih vrsta datoteka. Radi najbolje sigurnosti uključite ovu ekstenziju u PHP konfiguraciji.
      max_file_size_exceeds_php: "Ovo premašuje stvarno ograničenje učitavanja na serveru od <strong>{limit}</strong> (<code>post_max_size={post}</code>, <code>upload_max_filesize={upload}</code>). PHP će odbiti datoteke veće od tog ograničenja bez obzira na ovu postavku. Smanjite ovu vrijednost ili povećajte ograničenja u <code>php.ini</code> (i <code>client_max_body_size</code> ako koristite Nginx)."
