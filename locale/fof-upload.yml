      image: "Podrazumijevani predložak za preuzimanje slika"
      image_description: |
        Prikazuje minijaturu slike, a preuzimanje ide preko PHP-a. Time se omogućava prikupljanje statistike i zaštita od direktnog povezivanja.
      image-preview: "Predložak za potpuni pregled slike"
      image-preview_description: |
        Prikazuje cijelu sliku u tekstu objave. Bez funkcije preuzimanja; statistika se ne prikuplja, a zaštita od direktnog povezivanja se ne primjenjuje.
      markdown-image: "Predložak za Markdown sliku"
      markdown-image_description: |
        Prikazuje cijelu sliku u tekstu objave putem Markdowna. <strong>Za ovo mora biti instalirana i uključena ekstenzija flarum/markdown.</strong> Bez funkcije preuzimanja; statistika se ne prikuplja, a zaštita od direktnog povezivanja se ne primjenjuje.
      bbcode-image: "Predložak za BBCode sliku"
      bbcode-image_description: |
        Prikazuje cijelu sliku u tekstu objave putem BBCodea. <strong>Za ovo mora biti instalirana i uključena ekstenzija flarum/bbcode.</strong> Bez funkcije preuzimanja; statistika se ne prikuplja, a zaštita od direktnog povezivanja se ne primjenjuje.
      just-url: "Samo URL"
      just-url_description: |
        Umeće samo URL. Prikaz mogu preuzeti druge ekstenzije koje automatski pretvaraju adrese u linkove. Bez funkcije preuzimanja; statistika se ne prikuplja, a zaštita od direktnog povezivanja se ne primjenjuje.
      text-preview: "Pregled teksta"
      text-preview_description: |
        Umeće pregled tekstualne datoteke (prvih 5 redova), uz mogućnost proširenja na cijeli sadržaj datoteke.
