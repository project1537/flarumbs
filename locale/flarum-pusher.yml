flarum-pusher:

  ##
  # UNIQUE KEYS - The following keys are used in only one location each.
  ##

  # Translations in this namespace are used by the admin interface.
  admin:

    # These translations are used in the Pusher Settings modal dialog.
    pusher_settings:
      app_cluster_label: "Klaster (Cluster)"
      app_cluster_help: "Klaster na kojem je smještena vaša Pusher aplikacija (npr. <code>eu</code> ili <code>us2</code>), prikazan na stranici „App Keys“ aplikacije. Ostavite prazno ako ispod unosite vlastiti naziv servera."
      app_id_label: "ID aplikacije (App ID)"
      app_id_help: "Brojčani ID aplikacije sa stranice „App Keys“ vaše Pusher aplikacije."
      app_key_label: "Ključ aplikacije (App Key)"
      app_key_help: "Javni ključ sa stranice „App Keys“ vaše Pusher aplikacije. Šalje se preglednicima, pa nije tajan."
      app_secret_label: "Tajni ključ aplikacije (App Secret)"
      app_secret_help: "Privatni tajni ključ sa stranice „App Keys“ vaše Pusher aplikacije. Čuvajte ga u tajnosti – koristi se samo na serveru."
      server_hostname_label: "Naziv servera (Server Hostname)"
      server_hostname_help: "Neobavezno. Zamjenjuje server na koji se klijent povezuje, za vlastiti server kompatibilan s Pusherom (npr. soketi). Ostavite prazno da se koristi Pusherov servis s klasterom iznad."
      title: "Postavke za Pusher"

  # Translations in this namespace are used by the admin interface.
  forum:

    # These translations are used in the discussion list.
    discussion_list:
      show_updates_text: "{count, plural, one {Prikaži # ažuriranu temu} few {Prikaži # ažurirane teme} other {Prikaži # ažuriranih tema}}"
