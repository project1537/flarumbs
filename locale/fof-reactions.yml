        button: "Pretvori stare reakcije"
        converting: "Reakcije se sada pretvaraju. Osvježite stranicu za nekoliko minuta da vidite da je postupak završen. (Pretvaranje može potrajati, zavisno od ukupnog broja reakcija.)"
        converted: "Uspješno pretvorena sviđanja: {number}"

