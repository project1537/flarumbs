    page:
      cdn:
        title: "CDN"
        help: |
          Resursi reakcija podrazumijevano se isporučuju s Cloudflareovog CDN-a. Po potrebi možete navesti adresu bilo kojeg drugog CDN-a.
          <code>[codepoint]</code> se zamjenjuje kodnom tačkom (codepoint) emojija.

          Na primjer, za prelazak na Noto Emoji putem jsdelivra unesite <code>https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@v2.040/svg/emoji_u[codepoint].svg</code>.

          CDN mora podržavati Emoji/Unicode {emojibase} ili noviju verziju. Koristite [twemoji] da se umetne verzija Twemojija.
        label: "URL"
        default-url: "Podrazumijevano: {url}"
