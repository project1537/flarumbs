flarum-gdpr:
  lib:
    data:
      followuser:
        export_description: "Izvozi podatke o korisnicima koje korisnik prati i korisnicima koji njega prate."
        anonymize_description: "=> flarum-gdpr.lib.data.followuser.delete_description"
        delete_description: "Briše sve podatke povezane s praćenjem korisnika."

ianm-follow-users:
  admin:
    permissions:
      follow_label: "Praćenje drugih korisnika"
      be_followed_label: "Drugi korisnici ih mogu pratiti"
      view_followed_users_label: "Uvid u to koga član prati"
    settings:
      button-on-profile-label: "Prikaži dugme „Prati“ direktno u zaglavlju profila korisnika"
      stats-on-profile-label: "Prikaži broj pratilaca i praćenih korisnika na profilima"

  forum:
    followed: "Praćeni"
    followers: "{count, plural, one {Pratilac} few {Pratioca} other {Pratilaca}}"
    profile_link: => ianm-follow-users.lib.following_link
    followers_link: "Pratioci"

    profile_page:
      no_following: "Još nikoga ne pratite."
      no_followers: "Još nemate pratilaca."

    user_controls:
      follow_button: => ianm-follow-users.lib.follow
      unfollow_button: => ianm-follow-users.lib.unfollow
      change_button: => ianm-follow-users.lib.change_follow_type

    settings:
      notify_new_follower_label: "Neko me počne pratiti"
      notify_new_unfollower_label: "Neko me prestane pratiti"
      notify_new_discussion_label: "Neko koga pratim pokrene temu"
      notify_new_post_label: "Neko koga pratim objavi u postojećoj temi"
      block_follow: "Ne dozvoli drugima da me prate"

    index:
      follow_tag_button: => ianm-follow-users.lib.follow
      unfollow_tag_button: => ianm-follow-users.lib.change_follow_type

    notifications:
      new_discussion_text: "{username} – nova tema"
      new_post_text: "{username} – nova objava u temi"
      new_follower_text: "{username} vas sada prati"
      new_unfollower_text: "{username} vas više ne prati"

    badge:
      label:
        follow: "Prati teme"
        lurk: "Prati sve"

    filter:
      following: "Praćeni korisnici"

    modals:
      select_follow_level:
        title: "Nivo praćenja za korisnika {username}"
        description: "Odaberite kako želite pratiti korisnika <em>{username}</em>."

        follow_levels_heading: "Nivoi praćenja"
        follow_select_label: "Vrsta praćenja"

        no_user_attr_provided_err: "Došlo je do greške pri otvaranju ovog prozora."
        no_user_attr_provided_err_debug: "Prozoru SelectFollowUserLevel pri kreiranju nije proslijeđen atribut `user`. Prozor se ne može prikazati."

        save_btn: "Sačuvaj"
        cancel_btn: "Odustani"

  email:
    new_discussion_by_user:
      subject: "Nova tema korisnika {user_display_name}"
      plain:
        body: |
          Nova tema korisnika {user_display_name}: {discussion_title}

          {discussion_url}

          ---

          {post_content}
      html:
        body: "Nova tema korisnika {user_display_name}: [{discussion_title}]({discussion_url})."

    new_follower:
      subject: "{follower_display_name} Vas sada prati"
      plain:
        body: |
          {follower_display_name} Vas sada prati i dobijat će obavještenje kada pokrenete novu temu.

          {profile_url}
      html:
        body: "{follower_display_name} Vas sada prati i dobijat će obavještenje kada pokrenete novu temu."

    new_post:
      subject: "Nova objava korisnika {user_display_name} u temi {discussion_title}"
      plain:
        body: |
          Nova objava korisnika {user_display_name} u temi {discussion_title}.

          {post_url}

          ---

          {post_content}

          ---

          Dok ne pročitate nove objave u ovoj temi, nećete primati nova obavještenja o njoj.
      html:
        body: "Nova objava korisnika {user_display_name} u temi [{discussion_title}]({post_url})."

  lib:
    following_link: "Praćeni korisnici"

    follow: "Prati"
    change_follow_type: "Promijeni vrstu praćenja"
    unfollow: "Prestani pratiti"

    follow_levels:
      unfollow:
        name: "Ne prati"

        description: |
          Ne primaj obavještenja o aktivnostima korisnika <em>{username}</em>.

      follow:
        name: "Prati teme"

        description: |
          Primaj obavještenja kada <em>{username}</em> pokrene novu temu.

      lurk:
        name: "Prati sve"

        description: |
          Primaj obavještenja kada <em>{username}</em> pokrene novu temu ili objavi u bilo kojoj temi.
    gambits:
      followeduser:
        key: praceni
