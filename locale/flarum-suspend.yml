flarum-suspend:

  ##
  # UNIQUE KEYS - The following keys are used in only one location each.
  ##

  # Translations in this namespace are used by the admin interface.
  admin:

    # These translations are used in the Permissions page of the admin interface.
    permissions:
      suspend_users_label: "Blokiranje korisnika"

  # Translations in this namespace are used by the forum user interface.
  forum:
    # These translations are used in the suspension notifications
    notifications:
      user_suspended_text: "Vaš korisnički račun je blokiran na {timeReadable}"
      user_suspended_indefinite_text: "Vaš korisnički račun je blokiran na neodređeno vrijeme"
      user_unsuspended_text: "Blokada vašeg korisničkog računa je uklonjena"

    # These translations are used for the suspension reason informational modal to the suspended user.
    suspension_info:
      dismiss_button: "Zatvori"
      indefinite: "Blokada je na neodređeno vrijeme"
      limited: "Blokada traje do {date}"
      title: "Ovaj korisnički račun je blokiran"

    # These translations are used in the Suspend User modal dialog (admin function).
    suspend_user:
      display_message: "Poruka koja se prikazuje korisniku"
      indefinitely_label: "Blokiran na neodređeno vrijeme"
      limited_time_days_text: " dana"
      limited_time_label: "Blokiran na određeno vrijeme..."
      not_suspended_label: "Nije blokiran"
      placeholder_optional: "Neobavezno"
      reason: "Razlog blokade"
      status_heading: "Status blokade"
      submit_button: => core.ref.save_changes
      title: "Blokada korisnika {username}"

    # These translations are displayed as tooltips for user badges.
    user_badge:
      suspended_tooltip: "Blokiran"

    # These translations are found on the user profile page (admin function).
    user_controls:
      suspend_button: "Blokiraj"

  # Translations in this namespace are used by suspension email notifications
  email:
    no_reason_given: "Razlog blokade nije naveden."
    suspended:
      subject: "Vaš korisnički račun je blokiran"
      plain:
        body: |
          Vaš korisnički račun je blokiran iz sljedećeg razloga:

          ---
          {suspension_message}
          ---
      html:
        body: "Vaš korisnički račun na platformi {forumTitle} je blokiran iz sljedećeg razloga:"

    unsuspended:
      subject: "Blokada Vašeg korisničkog računa je uklonjena"
      plain:
        body: |
          Blokada Vašeg korisničkog računa je uklonjena. Na platformu se možete vratiti putem sljedećeg linka:

          {forum_url}
      html:
        body: "Blokada Vašeg korisničkog računa je uklonjena. Na platformu [{forumTitle}]({forum_url}) možete se vratiti kada budete spremni."

  # Translations in this namespace are used by the forum and admin interfaces.
  lib:

    # These translations are used by gambits. Gambit keys must be in snake_case, no spaces.
    gambits:
      users:
        suspended:
          key: blokiran

# Labels for the audit log entries this extension produces, rendered by the (optional)
# flarum/audit browser. Defined under the flarum-audit namespace so the audit frontend
# resolves them, but shipped here so they travel with the extension that owns the actions.
flarum-audit:
  lib:
    browser:
      user:
        suspended: "Blokiran korisnik {username} do {until}"
        unsuspended: "Uklonjena blokada korisnika {username}"
