fof-move-posts:
  admin:
    settings:
      moved_first_post_content: "Sadržaj prve objave premještene teme"
      moved_first_post_content_help: "Kada tema ima samo jednu objavu, njenim premještanjem prva objava izvorne teme mijenja se tako da upućuje na novu temu. Sadržaj te objave možete urediti ovdje."
      group_sequential_posts: "Spoji uzastopne obavijesti o premještanju objava u jednu."

    permissions:
      move_posts: => fof-move-posts.ref.move_posts

  forum:
    badge:
      first_moved_tooltip: "Premješteno"

    discussion:
      move_posts: => fof-move-posts.ref.move_posts

    error:
      move_old_post_to_newer_discussion: => fof-move-posts.ref.status.old_to_new_move
      move_posts_to_same_discussion: "Objave se ne mogu premjestiti u istu temu."

    modal:
      check: "Provjeri vrstu premještanja"
      destination: "Ciljna tema"
      discussion_help: "Koristit će se oznake izvorne teme, a mogu se promijeniti nakon što se tema napravi."
      discussion_name: => core.forum.composer_discussion.title_placeholder
      new_discussion: "Nova tema"
      selected_posts: "{count, plural, one {Odabrana je # objava} few {Odabrane su # objave} other {Odabrano je # objava}}"
      status:
        complex_move: "Ovo će biti složeno premještanje: objave će biti umetnute između postojećih objava, pa će se promijeniti i stari URL-ovi objava u ciljnoj temi."
        old_to_new_move: => fof-move-posts.ref.status.old_to_new_move
        simple_move: "Ovo će biti jednostavno premještanje: sve objave bit će dodane na kraj teme."
      submit: "Nastavi"
      title: => fof-move-posts.ref.move_posts
      confirm_move_all_to_new_discussion: "Spremate se premjestiti sve objave iz ove teme u novu temu. U većini slučajeva smislenije je urediti postojeću temu, npr. promijeniti njen naslov, oznake ili druge podatke. Želite li nastaviti?"

    alerts:
      posts_moved_to: "{count, plural, one {# objava premještena je u temu {target_discussion}.} few {# objave premještene su u temu {target_discussion}.} other {# objava premješteno je u temu {target_discussion}.}}"

    notifications:
      post_moved_text: "Jedna ili više vaših objava premještena je u temu {targetDiscussionTitle}."

    post:
      unmove: "Poništi odabir za premještanje"
      move: "Odaberi za premještanje"
      moving: "Premještanje objave"

    post_stream:
      post_moved: "{count, plural, one {{username} – # objava premještena je u temu {target_discussion}.} few {{username} – # objave premještene su u temu {target_discussion}.} other {{username} – # objava premješteno je u temu {target_discussion}.}}"

  ref:
    move_posts: "Premjesti objave"

    status:
      old_to_new_move: "Starija objava ne može se premjestiti u noviju temu."

  lib:
    discussion:
      first_post:
        default_content: >
          *Ova objava je premještena u temu **[%DISCUSSION_NAME%](%POST_LINK%)**.*

# Audit log action labels, contributed to the flarum/audit namespace.
# Rendered by flarum-audit at flarum-audit.lib.browser.<action>.
flarum-audit:
  lib:
    browser:
      posts:
        moved: "{post_count, plural, one {Premještena je # objava} few {Premještene su # objave} other {Premješteno je # objava}} iz teme {discussion} u temu {new_discussion}"
        moved_to_new_discussion: "{post_count, plural, one {Premještena je # objava} few {Premještene su # objave} other {Premješteno je # objava}} iz teme {discussion} u novu temu {new_discussion}"
