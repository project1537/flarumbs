  admin:
    settings:
      widget_layout: "Raspored dodatka"
      widget_layout_help: "Klasični: sažet prikaz u bočnoj traci. Puna širina: traka u jednom redu iznad liste tema."
      widget_layout_classic: "Bočna traka (klasični)"
      widget_layout_full_width: "Puna širina (iznad tema)"
      bar_position_desktop: "Položaj trake (računar)"
      bar_position_desktop_help: "Gdje se na računaru prikazuje traka sa statistikom u odnosu na traku s alatima. Važi samo za raspored pune širine."
      bar_position_mobile: "Položaj trake (mobitel)"
      bar_position_mobile_help: "Gdje se na mobitelu prikazuje traka sa statistikom u odnosu na traku s alatima."
      bar_position_above: "Iznad trake s alatima"
      bar_position_inside: "Unutar trake s alatima"
      bar_position_below: "Ispod trake s alatima"
      bar_position_above_footer: "Iznad podnožja"
      widget_position: "Položaj u bočnoj traci (prioritet)"
      widget_position_help: "Određuje gdje se dodatak prikazuje u bočnoj traci. Manje (negativnije) vrijednosti spuštaju ga niže. Podrazumijevano: -10. Važi samo za raspored s bočnom trakom."

      section_online_users: "Korisnici na mreži"
      section_online_users_help: "Podešavanje prikaza korisnika na mreži u proširenom panelu."
      show_online_users: "Prikaži korisnike na mreži"
      show_online_users_help: "Potpuno uključuje ili isključuje prikaz korisnika na mreži. Kada je isključen, upiti o korisnicima na mreži se ne izvršavaju."
      last_seen_interval: "Interval posljednje aktivnosti (minute)"
      last_seen_interval_help: "Koliko minuta nakon posljednje aktivnosti se korisnik smatra prisutnim na mreži. Podrazumijevano: 5, što odgovara signalu prisutnosti (uključen podrazumijevano). Signal održava aktivnost svježom dok je kartica s platformom otvorena i u fokusu, pa aktivni korisnici ne nestaju s liste. Ako isključite signal prisutnosti, povećajte ovu vrijednost na 10 ili više, da korisnici ne bi povremeno nestajali s liste usred korištenja."
      online_users_cache_ttl: "Trajanje keš memorije za korisnike na mreži (sekunde)"
      online_users_cache_ttl_help: "Koliko dugo se lista korisnika na mreži čuva u keš memoriji. Vode se dvije odvojene keš memorije: jedna za korisnike s dozvolom „Uvijek vidi vrijeme posljednje aktivnosti korisnika“, koji vide i skrivene korisnike, i jedna za sve ostale."
      enable_heartbeat: "Uključi signal prisutnosti"
      enable_heartbeat_help: "Kada je uključen, svaka otvorena kartica s platformom koja je u fokusu šalje mali signal u pozadini. Za prijavljene korisnike to održava oznaku „na mreži“ tačnom dok čitaju ili pišu bez prelaska na druge stranice (npr. pri pisanju dužeg odgovora uz ekstenziju za rad uživo). Za goste (kada je uključeno brojanje gostiju) na ovaj način se prikuplja broj gostiju. Opterećenje servera je zanemarivo: upisi se na serveru ograničavaju, bez obzira na broj otvorenih kartica. Isključite ako ne želite nikakav promet u pozadini."
      show_online_guests: "Prikaži goste na mreži"
      show_online_guests_help: "Kada je uključeno, u proširenom panelu se ispod skrivenih korisnika, kao krug s isprekidanom linijom, prikazuje približan broj neprijavljenih posjetilaca. Svaka kartica gosta šalje signal na posebnu adresu, koja hash IP adrese i podataka o pregledniku (User-Agent) bilježi u kratkotrajnu evidenciju prisutnosti. Broj gostiju je broj jedinstvenih zapisa unutar „intervala posljednje aktivnosti“. Brojanje je približno: posjetioci iza zajedničke mreže (NAT) broje se kao jedan, a korisnici mobilnih mreža s promjenjivim IP adresama mogu biti brojani više puta. U pregledniku posjetioca ne čuva se nikakav trajni identifikator."
      include_guests_in_total: "Uračunaj goste u glavni broj korisnika na mreži"
      include_guests_in_total_help: "Kada je uključeno, broj prikazan u traci (i u zaglavlju odjeljka u proširenom panelu) zbir je prijavljenih korisnika i gostiju. Redovi s detaljima u proširenom panelu i dalje ih prikazuju odvojeno. Isključite ako broj u traci treba obuhvatiti samo prijavljene korisnike."

      section_statistics: "Statistika platforme"
      section_statistics_help: "Podešavanje keš memorije za broj tema, broj objava, ukupan broj korisnika i najnovijeg korisnika."
      show_discussions_count: "Prikaži broj tema"
      show_posts_count: "Prikaži broj objava"
      show_users_count: "Prikaži broj korisnika"
      show_latest_registration: "Prikaži najnovijeg korisnika"
      stats_cache_duration: "Trajanje keš memorije za statistiku (sekunde)"
      stats_cache_duration_help: "Koliko dugo se broj tema, broj objava, ukupan broj korisnika i najnoviji korisnik čuvaju u keš memoriji. Keš memorija se automatski briše kada se teme, objave ili korisnici dodaju ili obrišu. Vrijednost 0 isključuje keš memoriju (ne preporučuje se za velike platforme)."
      ignore_private_discussions: "Ne uračunavaj privatne teme"
      show_toggle: "Prikaži dugme za proširivanje i skupljanje"
      show_toggle_help: "Da li se prikazuje dugme sa strelicom koje proširuje i skuplja panel s detaljima. Kada je isključeno, panel se i dalje otvara klikom na traku (način „cijela traka“) ili na polje s brojem korisnika na mreži (način „samo polje korisnika na mreži“)."
      expanded_panel_width: "Širina proširenog panela (računar)"
      expanded_panel_width_help: "Cijela traka: panel zauzima punu širinu trake, a otvara se klikom bilo gdje na traku. Samo polje korisnika na mreži: panel se prikazuje samo ispod broja korisnika na mreži, a otvara se klikom na to polje."
      expanded_panel_width_full_bar: "Cijela traka"
      expanded_panel_width_online_cell: "Samo polje korisnika na mreži"
    permissions:
      view_online_users: "Pregled korisnika na mreži"
      view_discussions_count: "Pregled broja tema"
      view_posts_count: "Pregled broja objava"
      view_users_count: "Pregled broja korisnika"
      view_latest_registration: "Pregled najnovijeg korisnika"
