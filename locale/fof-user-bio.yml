fof-user-bio:
    admin:
        permission:
            view: "Pregled biografije"
            editOwn: "Uređivanje vlastite biografije"
            editAny: "Uređivanje biografije bilo kojeg korisnika"
        setting:
            bioLimit: "Najveći broj znakova u biografiji"
            maxLines: "Najveći broj redova koji se prikazuju odjednom"
            allowFormatting: "Dozvoli formatiranje u biografiji"
            allowFormatting_help: "Ovo formatiranje je namjerno odvojeno od formatiranja objava. Ako su uključene ekstenzije BBCode i/ili Markdown, mogu se koristiti i za formatiranje biografije. Slike i ugrađeni sadržaj nisu dozvoljeni. Ekstenzije koje proširuju Flarumov formater moraju *izričito* dodati podršku za formater biografije."

    forum:
        userbioPlaceholder: "Napišite nešto o sebi"
        userbioPlaceholderOtherUser: "Napišite biografiju za korisnika {username}"

        profile:
            cancel_confirm: "Jeste li sigurni da želite prekinuti uređivanje biografije? Sve izmjene koje ste napravili bit će izgubljene."
