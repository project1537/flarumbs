        title: Neobrađeni zabilježeni podaci
        copy: Kopirajte
        copied: Kopirano u clipboard.
        copy_failed: Kopiranje u clipboard nije uspjelo.

  forum:
    sign_up:
      trap_label: Ostavite ovo polje praznim
    post:
      flagged_as_spam_text: "Automatsko otkrivanje spama – rezultat {score}"
      held_email_domain_text: "Zadržano na odobrenje: novi nalog s e-mail adresom na domeni {domain}"

    message:
      profile:
        blocked: Ovo liči na spam, pa nije sačuvano. Uklonite sve linkove i kontakt podatke i pokušajte ponovo.

      honeypot:
        refused: "Nismo mogli dovršiti vašu registraciju."
        reload: "Nešto je pošlo po zlu s obrascem za registraciju. Osvježite stranicu i pokušajte ponovo."
      stopforumspam:
        blocked: Podaci o vašoj registraciji pronađeni su u bazi za sprečavanje spama, pa je registracija blokirana.

    spammer_modal:
      hard_delete_discussions_label: Obrišite teme
      hard_delete_discussions_help: Ovo će trajno obrisati sve teme koje je pokrenuo ovaj član. Kada je isključeno, teme će umjesto toga biti sakrivene.
      hard_delete_posts_label: Obrišite objave
      hard_delete_posts_help: Ovo će trajno obrisati sve objave (komentare, odgovore itd.) ovog člana. Kada je isključeno, objave će umjesto toga biti sakrivene.
      hard_delete_user_label: Obrišite člana
      hard_delete_user_help: Ovo će trajno obrisati člana. Kada je isključeno, član će umjesto toga biti suspendovan.
      intro: Kada član bude označen kao spamer, poduzima se nekoliko radnji, ovisno o ekstenzijama dostupnim na platformi.
      move_discussions_tag_label: Premjesti teme u oznaku za karantin
      move_discussions_tag_help: Ovo će premjestiti sve teme koje je pokrenuo ovaj član u oznaku koju ste naveli u postavkama platforme. Kada je isključeno, teme ostaju u svojim trenutnim oznakama.
      process_button: Provedite
      success: "Član {username} označen je kao spamer."
      title: "Označite {username} kao spamera"
      report_to_sfs_label: Prijavi StopForumSpam-u
      report_to_sfs_help: Ovo će StopForumSpam-u prijaviti osnovne podatke člana (korisničko ime, e-mail, IP adresu). To pomaže da se član spriječi u registraciji na drugim forumima koji koriste uslugu StopForumSpam.
    user_controls:
      spammer_button: Spamer

# Oznake radnji u revizijskom dnevniku, dodaju se u prostor imena flarum/audit.
# Prikazuje ih flarum-audit na putanji flarum-audit.lib.browser.<action>.
flarum-audit:
  lib:
    browser:
      user:
        marked_as_spammer: Član {username} označen je kao spamer
      registration:
        blocked: Blokirana registracija za {username} ({email}) s adrese {ip}
