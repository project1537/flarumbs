      evidence:
        label: "Zašto je blokirano"
        none: "Za ovaj pokušaj nisu zabilježeni StopForumSpam podaci."
        lookup_failed: "Upit prema StopForumSpam servisu nije uspio, pa za ovaj pokušaj nema podataka."
        blocked_by: "Blokirano zbog"
        rule:
          confidence: "Prag pouzdanosti"
          frequency: "Prag broja prijava"
