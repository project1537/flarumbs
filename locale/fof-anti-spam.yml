fof-anti-spam:
  admin:
    permissions:
      spamblock_users_label: Označavanje članova kao spamera
    tabs:
      sign_ups: Registracije
      stopforumspam: StopForumSpam
      content_filter: Filter sadržaja
      spammer_actions: Radnje nad spamerima
    unsaved_changes: Na ovoj kartici imate nesačuvane promjene. Napustiti je bez čuvanja?
    settings:
      sign_ups:
        heading: Provjere pri registraciji
        introduction: Provjere koje ova platforma sama obavlja pri svakoj registraciji, bez slanja ičega vanjskoj usluzi. Provjere kod StopForumSpam imaju vlastitu karticu.

        honeypot_heading: Honeypot
        honeypot_label: Zamka za botove koji popunjavaju obrasce
        honeypot_help: Dodaje u obrazac za registraciju polje koje ljudi nikad ne vide i odbija registracije koje ga popune ili stignu brže nego što bi osoba mogla. Hvata botove koje StopForumSpam još nije vidio, ne šalje ništa izvan platforme i ne traži ništa od stvarnih ljudi.
        honeypot_min_seconds_label: Najmanji broj sekundi prije registracije
        honeypot_min_seconds_help: Računa se od trenutka kada je stranica poslužena. Osobi koja čita obrazac treba duže od toga; skripti ne.
        honeypot_strict_label: Odbij registracije koje zaobilaze obrazac
        honeypot_strict_help: Odbija i registracije gostiju poslane bez obrasca, kao što rade skripte koje šalju podatke direktno API-ju. Ostavite isključeno ako aplikacija, SSO most ili drugi alat kreira naloge preko API-ja.

        throttle_heading: Ograničenje učestalosti
        registration_throttle_label: Sekundi između registracija s jedne adrese
        registration_throttle_help: Flarum ograničava koliko često neko može objavljivati, ali ne i koliko često može kreirati naloge. 0 isključuje ograničenje. Imajte na umu da uredi, škole i mobilne mreže dijele jednu adresu među mnogo ljudi.

      content-filter:
        heading: Filter sadržaja
        introduction: Automatski otkriva i prijavljuje spam sadržaj novih članova. Sistem prati objave i teme novih naloga tražeći uobičajene pokazatelje spama, poput telefonskih brojeva, e-mail adresa i sumnjivih URL-ova.
        enabled_label: Uključi filtriranje sadržaja
        enabled_help: Kada je uključeno, objave i teme novih članova analiziraju se na pokazatelje spama.

        user_targeting_heading: Ciljanje članova
        monitor_all_users_label: Prati sve članove
        monitor_all_users_help: >
          Provjerava svaku objavu, a ne samo objave novih naloga. Bez ovoga nalog se nikad više
          ne ispituje čim prijeđe dolje navedene granice, a to je upravo slučaj s članom čiji je
          nalog preuzet ili s nalogom koji neko vrijeme objavljuje bezazleno prije nego što počne
          objavljivati spam. Administratori i svi čija grupa može sakriti teme nikad se ne prate,
          bez obzira na ovu postavku. Očekujte više lažnih pozitivnih rezultata kod etabliranih
          članova, pa prije uključivanja pregledajte svoje pragove.
        monitor_post_count_label: Prati članove do broja objava
        monitor_post_count_help: >
          Nalog se prati dok ne napravi više od ovoliko javnih objava i dok ne prijeđe i dolje
          navedenu starosnu granicu. Objave koje čekaju odobrenje ne računaju se dok ne budu
          odobrene.
        monitor_hours_old_label: Prati članove do broja sati nakon prve objave
        monitor_hours_old_help: >
          Nalog se prati do ovoliko sati nakon što je napisao prvu objavu koja je sada javna, i dok
          ne prijeđe i gore navedeni broj objava. Sati se računaju od te objave, a ne od
          registracije, pa nalog ništa ne dobija time što miruje prije nego što počne objavljivati.
          Kod 0 odlučuje samo broj objava.

        held_email_domains_heading: Zadržavanje novih naloga prema e-mail domeni
        held_email_domains_label: E-mail domene za zadržavanje
        held_email_domains_help: >
          Svaka objava novog naloga čija je e-mail adresa na jednoj od ovih domena zadržava se na
          odobrenje, bez obzira na sadržaj. Unesite jednu domenu po redu; poddomene su uključene.
          Nalog je nov dok je unutar gore navedenog broja objava ili starosti, čak i kada se prate
          svi članovi, a zadržane objave računaju se u broj objava tek nakon odobrenja. Zadržavaju
          se samo nove objave: izmjene se prepuštaju filteru sadržaja. Ovo vrijedi i kada je filter
          sadržaja isključen. Administratori i svi čija grupa može sakriti teme nikad se ne
          zadržavaju. Moderatori koji vide prijave vide i domenu koja se poklopila.
        monitor_window_held_only: Kada se prate svi članovi, dvije dolje navedene granice samo određuju na koje se naloge primjenjuje zadržavanje po e-mail domeni.

        detectors_heading: Metode otkrivanja
        detect_phones_label: Otkrij telefonske brojeve
        detect_phones_help: Prijavi sadržaj koji sadrži telefonske brojeve u međunarodnom formatu.
        detect_local_phones_label: Otkrij i telefonske brojeve u lokalnom formatu
        detect_local_phones_help: >
          Računa i brojeve napisane bez pozivnog broja države, koji počinju nulom, kao što su
          061 234 567 ili 033 123 456. Uključite ako spam na vašoj platformi koristi lokalne
          brojeve. Teže se razlikuju od datuma i referentnih brojeva nego međunarodni, pa
          očekujte da će poneka obična objava biti prijavljena. Zahtijeva uključeno otkrivanje
          telefonskih brojeva.
        detect_emails_label: Otkrij e-mail adrese
        detect_emails_help: Prijavi sadržaj koji sadrži e-mail adrese.
        detect_urls_label: Otkrij URL-ove
        detect_urls_help: Prijavi sadržaj koji sadrži URL-ove koji nisu na listi dozvoljenih.
        detect_repeats_label: Otkrij ponovljene objave
        detect_repeats_help: >
          Prijavi objavu novog naloga koja govori isto što i jedna od njegovih nedavnih objava, ne
          uzimajući u obzir velika i mala slova, razmake, interpunkciju i oblikovanje. Samo novi
          nalozi, čak i kada se prate svi članovi. Objave kraće od 40 znakova smiju se ponavljati,
          a objave koje je obrisala osoba koja ih je napisala ne računaju se.

        posting_rate_heading: Učestalost objavljivanja
        burst_post_count_label: Dozvoljeno objava u kratkom roku
        burst_post_count_help: >
          Kada novi nalog napravi ovoliko objava u drugim temama unutar dolje navedenih minuta,
          svaka sljedeća objava ocjenjuje se kao spam dok se ne uspori. Vrijedi samo za nove
          naloge, čak i kada se prate svi članovi. Objave u temi u kojoj se trenutno objavljuje ne
          računaju se, pa razgovor u jednoj temi nije uhvaćen. Objave koje čekaju odobrenje
          računaju se, a izmjene ne. Kod 0 nema ograničenja.
        burst_minutes_label: U koliko minuta

        thresholds_heading: Pragovi ocjene spama
        flag_threshold_label: Prag prijave (0–100)
        flag_threshold_help: Sadržaj s ocjenom spama jednakom ili većom od ove vrijednosti bit će prijavljen moderatorima (zahtijeva ekstenziju flarum/flags).
        spam_threshold_label: Prag spama (0–100)
        spam_threshold_help: Sadržaj s ocjenom spama jednakom ili većom od ove vrijednosti automatski će biti vraćen na odobravanje (zahtijeva ekstenziju flarum/approval).

        actions_heading: Automatske radnje
        auto_unapprove_label: Automatski vrati spam sadržaj na odobravanje
        auto_unapprove_help: "Kada je uključeno, sadržaj koji dosegne prag spama šalje se u red za odobravanje (zahtijeva flarum/approval). Moderatori će morati odobriti sadržaj prije nego što postane vidljiv."
        auto_flag_label: Automatski prijavi spam sadržaj
        auto_flag_help: "Kada je uključeno, sadržaj koji dosegne prag prijave automatski se prijavljuje moderatorima na pregled (zahtijeva flarum/flags). Razlog prijave sadržavat će detalje o tome zašto je sadržaj prepoznat kao spam."
        flag_account_label: Nalog koji podiže prijave spama
        flag_account_help: Prikazuje se kao autor automatskih prijava spama u redu za moderaciju. Ako ostane zadano, prijave podiže prvi administrator.
        flag_account_default: "Zadano: prvi administrator"
        flag_account_choose_button: Odaberite…
        flag_account_default_button: Koristite zadano
        flag_account_modal_title: Odaberite nalog koji podiže prijave spama
        flag_account_missing: Odabrani nalog više ne postoji, pa prijave spama podiže prvi administrator dok ne odaberete drugi.
        flag_account_in_code: Odabrano u extend.php pomoću assignFlagsToModerator(), pa se ovdje ne može mijenjati.
        no_action_extensions: "Instalirajte ekstenzije flarum/approval i/ili flarum/flags da biste omogućili automatske radnje moderacije. Otkriveni spam bit će obrađivan kroz Flarumov ugrađeni red za odobravanje i sistem prijava."

        allowlist_heading: Lista dozvoljenih domena
        allowed_domains_label: Dozvoljene domene
        allowed_domains_help: URL-ovi s ovih domena neće biti prijavljeni. Unesite jednu domenu po redu. Domena vaše platforme automatski je na listi dozvoljenih.

        blocked_words_heading: Blokirane riječi i fraze
        blocked_words_label: Blokirane riječi ili fraze
        blocked_words_help: Riječi ili fraze koje treba blokirati kao spam. Unesite jednu po redu. Ne razlikuje velika i mala slova i podudara se samo s cijelim riječima. Na primjer, „viagra“ će se podudarati s „viagra“, ali ne s „niagara“.

        advanced_patterns_heading: Napredni obrasci blokiranja
        advanced_block_patterns_label: Napredni obrasci (regex)
        advanced_block_patterns_help: "Prilagođeni regex obrasci za iskusne korisnike. Koristite s oprezom: neispravni obrasci bit će preskočeni. Format treba biti JSON niz objekata s ključem „pattern“ i neobaveznim ključem „description“."

      default-actions:
        delete_user_label: Obrišite člana
        delete_user_help: Ovo će trajno obrisati člana. Kada je isključeno, član će umjesto toga biti suspendovan.
        delete_discussions_label: Obrišite teme
        delete_discussions_help: Ovo će trajno obrisati sve teme koje je pokrenuo ovaj član. Kada je isključeno, teme će umjesto toga biti sakrivene (meko brisanje).
        delete_posts_label: Obrišite objave
        delete_posts_help: Ovo će trajno obrisati sve objave ovog člana. Kada je isključeno, objave će umjesto toga biti sakrivene (meko brisanje).
        heading: Zadane radnje moderacije
        introduction: Kada je član označen kao spamer, moderatori mogu birati između različitih radnji za konkretan slučaj. Ove postavke omogućavaju da unaprijed odredite radnje koje obično poduzimate, kako biste ubrzali postupak, uz mogućnost odstupanja prema potrebi.
        move_discussions_to_tags_label: Premjesti teme u oznake
        move_discussions_to_tags_help: Ovo će premjestiti sve teme koje je pokrenuo ovaj član u oznake koje ste naveli. Očistite odabir oznaka da teme ostanu u izvornim oznakama. Nema efekta ako je uključena opcija „Obrišite teme“.

      stopforumspam:
        introduction: |
          Provjerava nove registracije u bazi <a>StopForumSpam</a>. Ako se dosegne prag <code>confidence</code> ili <code>frequency</code>, članu se onemogućava dovršavanje registracije na vašoj platformi.

          SSO registracija preko <code>fof/oauth</code> i <code>fof/passport</code> također je podržana. Ostali SSO davatelji bi trebali raditi, ali nisu testirani.

        username_label: Provjera spama za korisničko ime
        ip_label: Provjera spama za IP adresu
        email_label: Provjera spama za e-mail

        checks_heading: Šta provjeravati
        thresholds_heading: Kada blokirati
        also_block_heading: Blokiraj i
        reporting_heading: Prijavljivanje

        frequency_label: Prag učestalosti
        frequency_help: |
          Broj prijava spama među svim uključenim provjerama koji aktivira filter spama.
          Npr.: ako e-mail ima 1 pogodak, a IP 2 pogotka, ukupno je 3 pogotka. Ako je prag postavljen na 3 ili manje, registracija će biti spriječena.
        api_key_label: API ključ
        api_key_text: Možete prijavljivati spamere StopForumSpam-u kako bi šira zajednica ostala bez spama.
        api_key_instructions_text: <register>Registrujte se na StopForumSpam</register>. Zatim ćete morati <key>pribaviti API ključ</key>.

        regional_endpoint_label: Geografski pristup
        regional_endpoint_help: Zadano se provjera usmjerava na najbliži regionalni server radi najbržeg odgovora. Ako želite ograničiti promet na određeni region, na primjer radi usklađenosti s propisima o privatnosti kompanije ili države, možete forsirati vezu s određenim regionom.

        region_closest_label: Najbliži
        region_europe_label: Evropa
        region_us_label: Sjedinjene Države

        confidence_label: Pouzdanost
        confidence_help: Ocjena pouzdanosti prilično je dobar pokazatelj da bi provjeravano polje dovelo do neželjene aktivnosti. Postavite nivo pouzdanosti u postocima. Ako je polje jednako ovoj vrijednosti ili iznad nje, registracija će biti blokirana, bez obzira na gore navedeni test učestalosti.

        blocked_asns_label: Blokirani mrežni brojevi (ASN)
        blocked_asns_help: Jedan po redu ili odvojeni zarezom. Registracije s ovih mreža odbijaju se odmah, bez obzira na to je li adresa na listi. StopForumSpam pri svakoj provjeri vraća mrežni broj, a gotovo niko ne pregleda forum s hosting provajdera. Prihvata 31272 ili AS31272. Ostavite prazno da se mreža samo bilježi, bez radnje.
        max_listing_age_label: Ignoriši unose starije od (dana)
        max_listing_age_help: Viđenje od prije više godina malo govori o osobi koja se registruje danas. 0 zadržava sve unose, koliko god stari bili. Domene i mreže na crnoj listi uvijek se poštuju, bez obzira na ovo.
        lookup_failed: "StopForumSpam nije bio dostupan (prvi neuspjeh {when}). Registracije se propuštaju bez provjere dok se usluga ne oporavi."
        email_hash_label: Koristi hashiranu e-mail adresu
        email_hash_help: Šalje MD5 hash e-mail adrese ako ne želite slati samu adresu. Ova metoda zaobilazi sve crne liste, normalizaciju i provjere zaobilaženja prikrivanja.

        block_tor_exit_nodes_label: Blokiraj Tor izlazne čvorove
        block_tor_exit_nodes_help: Kada je uključeno, registracije s poznatih Tor izlaznih čvorova automatski se blokiraju. Ovo može spriječiti anonimne spam registracije, ali i legitimne članove koji koriste Tor radi privatnosti.

        sfs_lookup_label: Provjera registracija
        sfs_lookup_help: Ako je uključeno, baza StopForumSpam provjerava se kada se novi član registruje na vašoj platformi. Ako je član pronađen (korisničko ime, IP adresa, e-mail), a taj podatak je uključen i SFS nivo pouzdanosti dosegne vaš zadani nivo, bit će spriječen u dovršavanju registracije.

        report_blocked_registrations_label: Prijavi blokirane registracije
        report_blocked_registrations_help: Kada vlastiti podaci StopForumSpam-a blokiraju registraciju, pokušaj se prijavljuje nazad da bi se aktivnost spamera mogla potvrditi. Blokade zbog Tora ili zabranjene mreže nikad se ne prijavljuju, jer su to politika ove platforme, a ne dokaz. Zahtijeva StopForumSpam API ključ (vidi gore).

