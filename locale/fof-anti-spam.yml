          blacklisted: "Na crnoj listi"
          tor_exit: "Izlazni čvor mreže Tor"
          not_listed: "Nije na listi"
          confidence: "{value}% pouzdanosti"
          frequency: "{count, plural, one {prijavljeno # put} few {prijavljeno # puta} other {prijavljeno # puta}}"
          last_seen: "posljednji put viđeno {when}"
          asn: "AS{asn}"
          normalized: "svodi se na {value}"

      raw_data:
        button: "Prikaži izvorne podatke"
        title: "Izvorni zabilježeni podaci"
        copy: "Kopiraj"
        copied: "Kopirano u međuspremnik."
        copy_failed: "Kopiranje u međuspremnik nije uspjelo."

  forum:
    post:
      flagged_as_spam_text: "Automatsko prepoznavanje spama – ocjena {score}"

    message:
      profile:
        blocked: "Ovo izgleda kao spam, pa nije sačuvano. Uklonite linkove i kontakt podatke i pokušajte ponovo."

      stopforumspam:
        blocked: "Podaci vaše registracije pronađeni su u bazi podataka za sprečavanje spama, pa je registracija blokirana."

    spammer_modal:
      hard_delete_discussions_label: "Obriši teme"
      hard_delete_discussions_help: "Trajno se brišu sve teme koje je korisnik pokrenuo. Kada je isključeno, teme se umjesto toga sakrivaju."
      hard_delete_posts_label: "Obriši objave"
      hard_delete_posts_help: "Trajno se brišu sve objave korisnika (odgovori i sl.). Kada je isključeno, objave se umjesto toga sakrivaju."
      hard_delete_user_label: "Obriši korisnika"
      hard_delete_user_help: "Korisnik se trajno briše. Kada je isključeno, korisnik se umjesto toga blokira."
      intro: "Pri označavanju korisnika kao spamera poduzima se više radnji, zavisno od ekstenzija dostupnih na platformi."
      move_discussions_tag_label: "Premjesti teme u oznaku za karantin"
      move_discussions_tag_help: "Sve teme koje je korisnik pokrenuo premještaju se u oznaku navedenu u postavkama platforme. Kada je isključeno, teme ostaju u svojim trenutnim oznakama."
      process_button: "Izvrši"
      success: "Korisnik {username} označen je kao spamer."
      title: "Označavanje korisnika {username} kao spamera"
      report_to_sfs_label: "Prijavi servisu StopForumSpam"
      report_to_sfs_help: "Osnovni podaci korisnika (korisničko ime, e-mail, IP adresa) prijavljuju se servisu StopForumSpam. To pomaže da se korisnik spriječi u registraciji na drugim forumima koji koriste StopForumSpam."
    user_controls:
      spammer_button: "Spamer"

# Audit log action labels, contributed to the flarum/audit namespace.
# Rendered by flarum-audit at flarum-audit.lib.browser.<action>.
flarum-audit:
  lib:
    browser:
      user:
        marked_as_spammer: "Korisnik {username} označen kao spamer"
      registration:
        blocked: "Blokirana registracija korisnika {username} ({email}) s adrese {ip}"
